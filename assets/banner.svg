<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img">
  <title>svelte-motion</title>
  <desc>Videos as Svelte components. Timeline mark with playhead on dark tile.</desc>
  <g id="background">
    <rect x="0" y="0" width="1280" height="400" rx="16" fill="#0b1020"/>
    <rect x="1" y="1" width="1278" height="398" rx="16" fill="none" stroke="#1f2937" stroke-width="1"/>
  </g>
  <g id="mark" transform="translate(80,152)">
    <rect x="0" y="0" width="96" height="96" rx="21" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <rect x="21" y="36" width="54" height="9" rx="4.5" fill="#94a3b8"/>
    <rect x="21" y="54" width="36" height="9" rx="4.5" fill="#4b5563"/>
    <rect x="51" y="21" width="6" height="48" fill="#6366f1"/>
    <polygon points="45,21 63,21 54,33" fill="#6366f1"/>
  </g>
  <g id="wordmark">
    <text x="200" y="224" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="92" font-weight="700" letter-spacing="-2.5" fill="#f8fafc">svelte<tspan fill="#6366f1"> motion</tspan></text>
    <text x="204" y="274" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="400" letter-spacing="0.6" fill="#94a3b8">Videos as Svelte components</text>
  </g>
  <g id="timeline" stroke="#2f3a4d" stroke-width="1">
    <line x1="860" y1="200" x2="1200" y2="200"/>
    <line x1="860" y1="200" x2="860" y2="206"/>
    <line x1="891" y1="200" x2="891" y2="202"/>
    <line x1="922" y1="200" x2="922" y2="202"/>
    <line x1="953" y1="200" x2="953" y2="202"/>
    <line x1="984" y1="200" x2="984" y2="206"/>
    <line x1="1015" y1="200" x2="1015" y2="202"/>
    <line x1="1046" y1="200" x2="1046" y2="202"/>
    <line x1="1077" y1="200" x2="1077" y2="202"/>
    <line x1="1108" y1="200" x2="1108" y2="206"/>
    <line x1="1139" y1="200" x2="1139" y2="202"/>
    <line x1="1170" y1="200" x2="1170" y2="202"/>
    <line x1="1200" y1="200" x2="1200" y2="202"/>
  </g>
  <g id="playhead">
    <rect x="962" y="168" width="2" height="64" fill="#6366f1"/>
    <polygon points="959,168 967,168 963,176" fill="#6366f1"/>
  </g>
</svg>
