# Workflow linting.
#
# `yaml.safe_load` (and a careful read) accept things GitHub Actions rejects at
# load time: most famously an unquoted `${{ }}` containing a space-hash, where
# YAML turns the rest of the line into a comment and leaves an unterminated
# expression. The run then fails with "This run likely failed because of a
# workflow file issue" and zero jobs started — after the merge, on main.
#
# actionlint understands the Actions schema *and* the expression grammar, so it
# catches that class before it reaches a runner. It is the gate this repo was
# missing: every other workflow here was only ever validated by "it looked fine".
#
# shellcheck and pyflakes are disabled on purpose: they report shell style inside
# `run:` blocks, which drowns the workflow/expression errors this job exists for.

name: actionlint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned version and checksum: a tool that decides whether other workflows
      # are valid should not be able to change underneath us.
      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.7
          sha256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl -fsSLo /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${sha256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint --version

      - name: Lint workflows
        run: actionlint -shellcheck= -pyflakes= -color .github/workflows/*.yml
