# Versioning.
#
# Applies pending changesets and opens (or updates) a "Version Packages" pull
# request that bumps every package in the fixed group and writes the changelogs.
# Merging that pull request is what releases: the action then tags the bumped
# versions and creates the GitHub releases, and each release fires `publish.yml`
# (which does the actual npm publish through OIDC trusted publishing).
#
# Why the bump lives here and not in `publish.yml`: that workflow runs on
# `release: published`, i.e. *after* a version exists. It has nothing to bump.
#
# Two things outside this file:
#
#   1. Repository settings -> Actions -> General -> "Allow GitHub Actions to
#      create and approve pull requests" must be enabled, or the version pull
#      request is never created.
#   2. Normal pull requests still go through the usual review; this only opens
#      one branch (`changeset-release/main`).
#
# Verified 2026-10-25 against the changesets/action README (v2, for Changesets
# v3 — this repo runs @changesets/cli 3.0.3) and `changeset --help`, where the
# tag command is `git-tag`, not `tag`.

name: release

on:
  push:
    branches: [main]

# Serialise version runs: two of them racing would each rewrite the same
# package.json files and the second would conflict with the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # Write, to push the version commit and the tags.
  contents: write
  # Write, to open and update the version pull request.
  pull-requests: write
  # Needed by the called publish workflow, which mints an OIDC token for npm's
  # trusted publishing. A reusable workflow cannot hold more than its caller.
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      # "true" once this run tagged a release, which is when npm should publish.
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - run: bun install --frozen-lockfile

      # Generate the changeset BEFORE the action inspects `.changeset/`.
      #
      # changesets/action decides between "open a version PR" and "publish" by
      # looking for pending changesets first. With none, it takes the publish
      # path and never runs `version-script` — so a generator placed inside
      # version-script can never fire, because the thing it generates is the
      # precondition for running it. That is why nothing bumped after the 0.2.0
      # merge: the log said "No changesets found" and skipped straight to
      # `changeset git-tag`.
      - run: bun run changeset:auto

      - id: changesets
        uses: changesets/action@v2
        with:
          # No hand-written changeset is needed: the step above wrote one from
          # the commits since the last tag (default minor, major on a breaking
          # marker, patch when nothing shippable changed, no-op if a changeset
          # already exists or HEAD is a release commit).
          #
          # `vp fmt` runs after `changeset version` because the changelogs it
          # generates are not formatted, which failed `bun run check` on every
          # release merge. The chain stays inside the package script: Bun treats
          # everything after `bun run <script>` as arguments, so an inline
          # `&&` here would be passed to the first command as argv.
          version-script: bun run version-packages
          # Runs only once no changesets remain. Tags what was just merged;
          # `publish.yml` owns the npm publish, so this must not publish.
          publish-script: ./node_modules/.bin/changeset git-tag
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          # Tags, and creates the GitHub releases for them.
          create-github-releases: "true"
          push-git-tags: "true"
          # The GitHub API attributes the commit to the token owner (Michael)
          # and signs it with GitHub's key. The Git CLI would commit as whatever
          # `user.name` CI defaults to, which is nobody.
          push-with-git-cli: "false"

  # Publishing is a called job, not a reaction to the release event. Events
  # caused by GITHUB_TOKEN do not start workflows, so a `release: published`
  # trigger silently published nothing for the 0.2.0 release; the publish
  # workflow was only ever run by hand. Calling it here removes the event from
  # the path entirely.
  # Publishing is started from here, not reacted to. Events caused by
  # GITHUB_TOKEN do not start workflows, so the `release: published` trigger
  # silently published nothing for the 0.2.0 release.
  #
  # It DISPATCHES publish.yml rather than calling it with `uses:`. npm's trusted
  # publisher is bound to the workflow filename, and a called workflow reports
  # the caller (`release.yml`) as the OIDC `workflow_ref`, so the token exchange
  # failed with a 404 and the publish was skipped. A dispatched run is a real run
  # of publish.yml, which is the identity npm expects.
  publish:
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Dispatch is an API call against Actions, so it needs write access here.
      actions: write
      contents: read
    steps:
      - name: Start the publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref "${{ github.ref_name }}"
